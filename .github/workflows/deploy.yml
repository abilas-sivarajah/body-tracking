name: Tests und Deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Keine persönlichen Daten im Ausgabeordner
        run: npm run check:private
      - name: Unit-Tests
        run: npm test
      - name: Regeln und Functions im Emulator
        run: npm run test:emulator

  deploy:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Firestore-Regeln und Indizes deployen
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$GCP_SA_KEY" > "$key_file"
          project_id="$(node -p "JSON.parse(require('fs').readFileSync('$key_file','utf8')).project_id")"
          GOOGLE_APPLICATION_CREDENTIALS="$key_file" npx firebase deploy --only firestore --project "$project_id" --non-interactive
      - name: Vercel-Einstellungen laden
        run: npx --yes vercel@latest pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Bauen
        run: npx --yes vercel@latest build --prod --token="${{ secrets.VERCEL_TOKEN }}"
      - name: Veröffentlichen
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
